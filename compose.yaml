services:
  crm:
    build: .
    ports:
      - "3000:3000"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - crm-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  crm-data:
